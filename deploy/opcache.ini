# ==============================================================================
# PHP OPcache Tuning Configuration for 2GB VPS
# File path on Ubuntu: /etc/php/8.3/mods-available/opcache.ini
# ==============================================================================

[opcache]
; Enable OPcache for CLI & Web requests
opcache.enable=1
opcache.enable_cli=1

; Memory Allocation (64MB is plenty for Laravel on 2GB VPS)
opcache.memory_consumption=64

; Interned strings buffer (stores repetitive strings like class names)
opcache.interned_strings_buffer=16

; Maximum number of PHP scripts cached in RAM
opcache.max_accelerated_files=10000

; In production, revalidate timestamps every 60 seconds (or set 0 for zero disk checking)
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; Fast shutdown sequence
opcache.fast_shutdown=1

; Optimize code generation
opcache.optimization_level=0x7FFFBFFF
opcache.enable_file_override=1

; Buffer size for file-based JIT / JIT settings (if PHP 8.3 JIT enabled)
opcache.jit=tracing
opcache.jit_buffer_size=16M
