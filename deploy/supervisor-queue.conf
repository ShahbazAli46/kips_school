# ==============================================================================
# Supervisor Process Configuration for Laravel Queue Worker
# File path on Ubuntu: /etc/supervisor/conf.d/school-queue.conf
# ==============================================================================

[program:school-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/kips/school_backend/artisan queue:work database --sleep=3 --tries=3 --timeout=90 --max-time=3600 --max-jobs=500
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/kips/school_backend/storage/logs/queue.log
stopwaitsecs=3600
