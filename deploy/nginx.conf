# ==============================================================================
# Nginx Production Configuration for KIPS School Management System
# Optimized for 2GB VPS with Gzip/HTTP Compression & Next.js + Laravel API
# ==============================================================================

# ─── Upstream Servers ─────────────────────────────────────────────────────────
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream php_fpm {
    server unix:/run/php/php-fpm.sock;
    keepalive 32;
}

# ─── Main HTTP/2 & HTTPS Server Block ─────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/ssl/certs/kips_ssl.crt;
    ssl_certificate_key /etc/ssl/private/kips_ssl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Root for Laravel public directory
    root /var/www/kips/school_backend/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # ─── 🚀 Ultra-Fast Brotli & Gzip Compression ────────────────────────────────
    brotli on;
    brotli_comp_level 5;
    brotli_types
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/plain
        text/css
        text/javascript
        text/xml
        image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/plain
        text/css
        text/javascript
        text/xml
        image/svg+xml;

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ─── 1. Laravel API Endpoints (/api/...) ──────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── 2. Laravel Public Storage (/storage/...) ─────────────────────────────
    location /storage {
        alias /var/www/kips/school_backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # ─── 3. PHP-FPM Handler for Laravel ───────────────────────────────────────
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass_header Content-Encoding;
        
        # Buffer tuning for fast JSON delivery
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # ─── 4. Next.js Static Assets (_next/static/...) ──────────────────────────
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── 5. Next.js Frontend (All Other Routes) ──────────────────────────────
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ─── Deny Hidden Files (.env, .git, etc.) ─────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
